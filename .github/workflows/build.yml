name: Build Android Debug APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3"

jobs:
  build-debug-apk:
    name: Export Godot Android Debug APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Move export templates into place
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates"

          SRC="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          if [ -d "$SRC" ] && [ "$SRC" != "$DEST" ]; then
            mv "$SRC" "$DEST"
            echo "Templates movidos a $DEST"
          elif [ -d "$DEST" ]; then
            echo "Templates ya estaban en $DEST"
          else
            echo "ERROR: no se encontraron export templates en $SRC ni en $DEST"
            find / -maxdepth 6 -type d -iname "*.stable*" 2>/dev/null | grep export_templates || true
            exit 1
          fi

          ls -la "$DEST"

      - name: Configure Java SDK path in editor settings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          JAVA_HOME_PATH="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          echo "Java detectado en: $JAVA_HOME_PATH"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME_PATH}"
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Create temporary debug signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore /tmp/managua-debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Managua City Debug, OU=Development, O=Managua City, L=Managua, ST=Managua, C=NI"

      - name: Import project (generates .godot cache, surfaces script errors early)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --verbose --import

      - name: Export signed debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" "build/android/ManaguaCity-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ManaguaCity-debug-APK
          path: build/android/ManaguaCity-debug.apk
          if-no-files-found: error
          retention-days: 14
